name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check bili-together.user.js
      - run: npm test
      - run: node --check extension/content.js && node --check extension/popup.js
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: bili-together-extension
          path: dist/*.zip
